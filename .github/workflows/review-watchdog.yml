name: review-watchdog
on:
  schedule:
    - cron: "0 4 * * *"
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const flagged = [];
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo: context.repo.repo, state: "open", per_page: 100 });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const labels = issue.labels.map(l => l.name);
              if (labels.includes("approved-applied")) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo: context.repo.repo, issue_number: issue.number, per_page: 100 });
              const approved = comments.some(c => c.user.login === owner && /approv/i.test(c.body));
              if (approved) {
                if (!labels.includes("approved-pending")) {
                  await github.rest.issues.addLabels({owner, repo: context.repo.repo,
                    issue_number: issue.number, labels: ["approved-pending"]});
                  await github.rest.issues.createComment({owner, repo: context.repo.repo,
                    issue_number: issue.number,
                    body: "**[watchdog]** APPROVED detected. Awaiting Kimi application - flagged 'approved-pending'."});
                }
                flagged.push(issue.number);
              }
            }
            core.info("flagged: " + (flagged.join(",") || "none"));
