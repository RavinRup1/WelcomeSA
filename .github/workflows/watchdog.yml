name: watchdog
on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
permissions:
  issues: write
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run robot if any pillar is stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/watchdog.py
