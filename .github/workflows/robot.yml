name: welcomesa-robot
on:
  schedule:
    - cron: '23 03 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Collect attractions + gigs
        run: |
          python scripts/build_attractions.py
          python scripts/build_gigs.py
      - name: Commit data
        run: |
          git config user.name "stack-robot"
          git config user.email "stack-robot@users.noreply.github.com"
          git add data/
          git commit -m "robot update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git push
