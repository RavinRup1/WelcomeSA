<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007A4D">
<title>Welcome SA</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--green:#007A4D;--green-d:#005c3a;--gold:#FFB612;--red:#E03C31;--blue:#001489;
--ink:#1d1d1d;--cream:#FFF8EE;--card:#fff;--line:#eadfce;--muted:#6b6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink)}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
header h1{margin:0;font-size:1.2rem;letter-spacing:.5px}
header h1 b{color:var(--gold)}
header .sub{font-size:.7rem;opacity:.85;margin-top:2px}
nav{display:flex;gap:6px;padding:10px 14px 4px;position:sticky;top:calc(env(safe-area-inset-top) + 58px);background:var(--cream);z-index:15}
nav button{flex:1;padding:9px 2px;font-size:.85rem;font-weight:700;border:none;border-radius:10px;background:#e7ddcb;color:var(--muted);cursor:pointer}
nav button.on{background:var(--green);color:#fff}
/* HERO CAROUSEL */
#hero{position:relative;height:64vh;min-height:340px;overflow:hidden;background:var(--green-d)}
.flagbar{height:5px;background:linear-gradient(90deg,#E03C31 0 17%,#FFB612 17% 33%,#007A4D 33% 67%,#001489 67% 83%,#fff 83% 92%,#141414 92%)}
.langwash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;pointer-events:none;z-index:2}
.langwash #lw{font-size:26vw;font-weight:900;color:rgba(255,255,255,.30);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;transition:opacity 1.2s ease;line-height:1}
#lwl{font-size:.85rem;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.18em;text-transform:uppercase;transition:opacity 1.2s ease;padding:.25rem .7rem;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(0,0,0,.25)}
@media(min-width:720px){.langwash #lw{font-size:12rem}}
.slide .cap{z-index:3}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;cursor:pointer}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.slide .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.72))}
.slide .cap{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 46px);color:#fff}
.slide .cap .k{font-size:.68rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold)}
.slide .cap h2{margin:4px 0 4px;font-size:1.7rem;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.slide .cap p{margin:0;font-size:.85rem;opacity:.92;text-shadow:0 1px 4px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ribbon{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:-32px;transform:rotate(-35deg);background:var(--gold);color:#3a2c00;font-size:.66rem;font-weight:900;letter-spacing:1px;padding:5px 40px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#hdots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:5}
#hdots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}
#hdots i.on{background:var(--gold)}
/* controls */
#ctrl{padding:12px 14px 0}
#q{width:100%;padding:11px 14px;font-size:1rem;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none}
#chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 6px}
#chips button{flex:none;padding:7px 13px;font-size:.78rem;font-weight:700;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
#chips button.on{background:var(--gold);border-color:var(--gold);color:#3a2c00}
main{padding:8px 14px 24px}
/* photo-first cards */
.pcard{position:relative;border-radius:16px;overflow:hidden;margin-bottom:12px;cursor:pointer;background:#000;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.pcard img{width:100%;height:190px;object-fit:cover;display:block}
.pcard .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.78))}
.pcard .tx{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.pcard .tx h3{margin:0 0 3px;font-size:1.15rem;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pcard .tx p{margin:0;font-size:.78rem;opacity:.92}
.pcard .bdg{position:absolute;top:12px;left:12px;font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.8px;background:rgba(0,0,0,.45);color:var(--gold);padding:4px 10px;border-radius:12px;backdrop-filter:blur(4px)}
.empty{text-align:center;color:var(--muted);padding:34px 20px;font-size:.9rem}
/* sheet */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#modal.open{display:flex}
#sheet{background:#fff;width:100%;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
#sheet .hero{width:100%;max-height:250px;object-fit:cover}
#sheet .pad{padding:16px}
#sheet .x{position:sticky;top:10px;float:right;margin:10px 10px 0 0;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
#sheet h2{margin:4px 0 6px;font-size:1.4rem}
#sheet .tag{color:var(--green);font-weight:700;font-size:.95rem;margin-bottom:10px}
#sheet .story{font-size:.95rem;line-height:1.6;margin-bottom:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fact{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact .k{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--red)}
.fact .v{font-size:.82rem;margin-top:3px;line-height:1.4}
#map{height:190px;border-radius:12px;background:#e7ddcb}
.lic{font-size:.66rem;color:var(--muted);margin-top:10px}
/* gigs */
.gig{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:11px 13px;margin-bottom:9px}
.gig .d{font-size:.72rem;font-weight:800;color:var(--red);text-transform:uppercase}
.gig .n{font-weight:800;margin:2px 0}
.gig .v{font-size:.78rem;color:var(--muted)}
.about{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.86rem;line-height:1.55}
.about h3{margin:14px 0 6px;font-size:.95rem}
footer{padding:14px;text-align:center;font-size:.7rem;color:var(--muted)}
</style>
</head>
<body>

<header><h1>WELCOME <b>SA</b></h1>
<div class="sub">South Africa, curated &middot; <span id="updated">loading&hellip;</span></div></header>
<div class="flagbar"></div>

<nav>
  <button data-v="home" class="on">Today</button>
  <button data-v="explore">Explore</button>
  <button data-v="gigs">Gigs</button>
  <button data-v="news">News</button>
  <button data-v="projects">Projects</button>
  <button data-v="about">About</button>
</nav>

<main id="view">Loading&hellip;</main>

<div id="modal"><div id="sheet"></div></div>

<footer>Built by <b>Ravin.R &amp; Kimi</b> &middot; data: Wikipedia (CC BY-SA) + event sources &middot; <a href="data/ATTRIBUTION.md">Attribution</a></footer>

<script>
const LANGS=[["Welcome to SA","English","rgba(0,122,77,.30)"],["Wamukelekile eSA","isiZulu","rgba(255,182,18,.32)"],["Wamkelekile eSA","isiXhosa","rgba(224,60,49,.30)"],["Welkom in SA","Afrikaans","rgba(0,20,137,.40)"],["O amogetswe SA","Sepedi","rgba(0,122,77,.30)"],["O amogetswe SA","Setswana","rgba(255,182,18,.32)"],["O amohetswe SA","Sesotho","rgba(224,60,49,.30)"],["U amukeriwile SA","Xitsonga","rgba(0,20,137,.40)"],["Wemukelekile SA","siSwati","rgba(0,122,77,.30)"],["Vha amukanyiwa vha SA","Tshivenda","rgba(255,182,18,.32)"],["Wamukelekile eSA","isiNdebele","rgba(224,60,49,.30)"],["\u{1F91F} Welcome to SA","SASL","rgba(255,182,18,.32)"]];
function startLangs(){const lw=document.getElementById("lw"),lwl=document.getElementById("lwl");if(!lw)return;let li=0;
setInterval(()=>{lw.style.opacity=0;if(lwl)lwl.style.opacity=0;setTimeout(()=>{li=(li+1)%LANGS.length;
lw.textContent=LANGS[li][0];lw.style.color=LANGS[li][2];lw.style.opacity=1;
if(lwl){lwl.textContent=LANGS[li][1];lwl.style.opacity=1;}},1200);},4200);}
const esc=s=>(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>((s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim());
let ATT=null,GIGS=null,DD=null,NEWS=null,PROJ=null,DV=null,VIEW="home",CAT="all",PROV="all",CUR=[],map=null,slideTimer=null;



function findAtt(d){
  const names=(d.match&&d.match.length?d.match:[d.name]).map(norm);
  const list=(ATT&&ATT.attractions)||[];
  for(const n of names){const hit=list.find(a=>norm(a.name)===n);if(hit)return hit;}
  for(const n of names){const hit=list.find(a=>norm(a.name).includes(n)||n.includes(norm(a.name)));if(hit)return hit;}
  return null;
}
function curated(){ // Ravin's rule: ONLY listings with photos
  if(!DD||!DD.items)return[];
  return DD.items.map(d=>({d,a:findAtt(d)}))
    .filter(x=>x.a&&x.a.image)
    .map(x=>({id:x.d.id,name:x.d.name,cat:x.d.category,tag:x.d.tagline,story:x.d.story,
      best:x.d.best,tip:x.d.tip,img:x.a.image,lat:x.a.lat,lng:x.a.lng,
      src:x.a.source_url,lic:x.a.license,prov:x.a.province}));
}
async function load(){
  try{
    const[dd,a,g,n,pj,dv]=await Promise.all([
      fetch("data/deepdives.json",{cache:"no-store"}).then(r=>r.ok?r.json():null),
      fetch("data/attractions.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch("data/gigs.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch("data/news.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch("data/projects.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch("data/dives.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)]);
    DD=dd;ATT=a;GIGS=g;NEWS=n;PROJ=pj;DV=dv;CUR=curated();
    const stamp=(a&&a.generated_at)||(dd&&dd.updated);
    document.getElementById("updated").textContent=stamp?("updated "+String(stamp).slice(0,10)):"data pending";
  }catch(e){document.getElementById("updated").textContent="offline";}
  render();
}
const CATS=[["all","All"],["natural","Nature"],["cultural","Culture"],["historical","History"],["beach","Beaches"],["wildlife","Wildlife"],["activity","Activities"]];
const PROVS=[["all","All provinces"],["KwaZulu-Natal","KZN"],["Gauteng","Gauteng"],["Western Cape","Western Cape"],["South Africa","National"]];

function todayIndex(){const n=CUR.length;if(!n)return 0;
  const day=Math.floor(Date.now()/864e5);return day%n;}

function render(){
  const v=document.getElementById("view");
  clearInterval(slideTimer);
  if(VIEW==="home"){
    if(!CUR.length){v.innerHTML='<div class="empty">Curated picks are on their way.</div>';return;}
    const ti=todayIndex();
    const order=[...CUR.slice(ti),...CUR.slice(0,ti)]; // today first
    v.innerHTML='<div id="hero"><div class="langwash"><span id="lw" style="color:rgba(0,122,77,.30)">Welcome to SA</span><span id="lwl">English</span></div>'+order.map((c,i)=>
      '<div class="slide'+(i===0?" on":"")+'" data-i="'+i+'">'+
      (i===0?'<div class="ribbon">Today\u2019s highlight</div>':'')+
      '<img src="'+esc(c.img)+'" alt="" loading="'+(i===0?"eager":"lazy")+'">'+
      '<div class="veil"></div><div class="cap"><div class="k">'+esc(c.cat)+'</div>'+
      '<h2>'+esc(c.name)+'</h2><p>'+esc(c.tag)+'</p></div></div>').join("")+
      '<div id="hdots">'+order.map((_,i)=>'<i data-i="'+i+'" class="'+(i===0?"on":"")+'"></i>').join("")+'</div></div>';
    const slides=[...v.querySelectorAll(".slide")],dots=[...v.querySelectorAll("#hdots i")];
    let cur=0;
    const go=n=>{slides[cur].classList.remove("on");dots[cur].classList.remove("on");
      cur=(n+slides.length)%slides.length;slides[cur].classList.add("on");dots[cur].classList.add("on");};
    dots.forEach(d=>d.onclick=e=>{e.stopPropagation();go(+d.dataset.i);restart();});
    slides.forEach(s=>s.onclick=()=>openDD(order[+s.dataset.i]));
    const restart=()=>{clearInterval(slideTimer);slideTimer=setInterval(()=>go(cur+1),4500);};
    restart();
    // swipe
    let x0=null;const hero=v.querySelector("#hero");
    hero.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
    hero.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;
      if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));x0=null;restart();},{passive:true});
  }
  else if(VIEW==="explore"){
    const q=(document.getElementById("q")?.value||"").toLowerCase();
    let shown=CUR.filter(c=>(CAT==="all"||c.cat===CAT)&&(PROV==="all"||c.prov===PROV));
    if(q)shown=shown.filter(c=>(c.name+" "+c.tag+" "+c.story).toLowerCase().includes(q));
    v.innerHTML='<div id="ctrl"><input id="q" type="search" placeholder="Search the curated list\u2026" value="'+esc(q)+'"></div>'+
    '<div id="chips">'+CATS.map(([k,l])=>'<button data-c="'+k+'" class="'+(CAT===k?"on":"")+'">'+l+'</button>').join("")+'</div>'+
    '<div id="chips">'+PROVS.map(([k,l])=>'<button data-p="'+k+'" class="'+(PROV===k?"on":"")+'">'+l+'</button>').join("")+'</div>'+
    (shown.length?shown.map((c,i)=>'<div class="pcard" data-i="'+i+'"><img src="'+esc(c.img)+'" alt="" loading="lazy">'+
      '<div class="ov"></div><span class="bdg">'+esc(c.cat)+'</span>'+
      '<div class="tx"><h3>'+esc(c.name)+'</h3><p>'+esc(c.tag)+'</p></div></div>').join("")
      :'<div class="empty">Nothing here yet - try another category.</div>');
    document.getElementById("q").addEventListener("input",render);
    v.querySelectorAll("#chips button[data-c]").forEach(b=>b.onclick=()=>{CAT=b.dataset.c;render();});
    v.querySelectorAll("#chips button[data-p]").forEach(b=>b.onclick=()=>{PROV=b.dataset.p;render();});
    v.querySelectorAll(".pcard").forEach(p=>p.onclick=()=>openDD(shown[+p.dataset.i]));
  }
  else if(VIEW==="gigs"){
    const evs=(GIGS&&GIGS.events)||[];
    v.innerHTML=evs.length?evs.map(e=>{const d=e.start?new Date(e.start):null;
      const ds=d?new Intl.DateTimeFormat("en-ZA",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}).format(d):"";
      return '<div class="gig"><div class="d">'+esc(ds)+'</div><div class="n">'+esc(e.name)+'</div>'+
      '<div class="v">'+esc(e.venue||"")+(e.url?' &middot; <a href="'+esc(e.url)+'" target="_blank" rel="noopener">tickets/info</a>':'')+' &middot; '+esc(e.source)+'</div></div>';}).join("")
      :'<div class="empty">The gig guide is warming up - sources are connected, more events tuning in.</div>';
  }
  else if(VIEW==="news"){
    const st=(NEWS&&NEWS.stories)||[];
    v.innerHTML=st.length?st.map(s=>'<div class="gig"><div class="d">'+esc(s.source)+'</div><div class="n">'+esc(s.title)+'</div><div class="v">'+esc(s.summary)+(s.url?' &middot; <a href="'+esc(s.url)+'" target="_blank" rel="noopener">read at source</a>':'')+'</div>'+(s.angle?'<div class="v" style="color:var(--green);font-style:italic">'+esc(s.angle)+'</div>':'')+'</div>').join("")
      :'<div class="empty">The news desk opens after the first morning run.</div>';
  }
  else if(VIEW==="projects"){
    const ps=(PROJ&&PROJ.projects)||[];
    v.innerHTML=ps.length?ps.map(p=>'<div class="gig"><div class="d">'+esc(p.sector||"")+' &middot; '+esc(p.province||"")+'</div><div class="n">'+esc(p.name)+'</div><div class="v">'+esc(p.what||"")+'</div>'+(p.why?'<div class="v" style="color:var(--green);font-style:italic">'+esc(p.why)+'</div>':'')+(p.status?'<div class="v">Status: '+esc(p.status)+'</div>':'')+(p.source_url?'<div class="v"><a href="'+esc(p.source_url)+'" target="_blank" rel="noopener">source</a></div>':'')+'</div>').join("")
      :'<div class="empty">The projects pillar arrives with the next two-weekly run.</div>';
  }
  else{
    v.innerHTML='<div class="about"><h3>Welcome SA</h3>A hand-picked showcase of South Africa - the places worth your time, one highlight a day.'+
    '<h3>The curation</h3>Every listing is chosen and approved by a human curator (no infinite lists, no filler). Currently showing <b>'+CUR.length+'</b> curated places with photography - the full approved set grows in batches.'+
    '<h3>Data &amp; licences</h3>Text and images: Wikipedia contributors, CC BY-SA 4.0 (each entry links to its article). Events: Ticketpro, Durban ICC, WhatsOnDurban, Webtickets listings. Maps: &copy; OpenStreetMap contributors, ODbL.'+
    '<h3>Colophon</h3>Built by <b>Ravin.R &amp; Kimi</b>. Robot refreshes data daily. Free, no logins, made in Durban.</div>';
  }
}
function openDD(c){
  const sh=document.getElementById("sheet");
  let rv=null;
  if(DV&&DV.dives){const names=[c.name,...(c.match||[])].map(norm);
    rv=DV.dives.find(d=>names.includes(norm(d.name)));}
  sh.innerHTML='<button class="x" onclick="closeDD()">\u2715</button>'+
   (c.img?'<img class="hero" src="'+esc(c.img)+'">':'')+'<div class="pad">'+
   '<h2>'+esc(c.name)+'</h2><div class="tag">'+esc(c.tag)+'</div>'+
   '<div class="story">'+esc(c.story)+'</div>'+
   (rv&&rv.story&&norm(rv.story)!==norm(c.story)?
   '<div class="tag" style="margin-top:.7rem">The fuller picture</div><div class="story">'+esc(rv.story)+'</div>'+
   '<div class="facts"><div class="fact"><div class="k">Best time</div><div class="v">'+esc(rv.best||'')+'</div></div>'+
   '<div class="fact"><div class="k">Insider tip</div><div class="v">'+esc(rv.tip||'')+'</div></div></div>':'')+
   '<div class="facts"><div class="fact"><div class="k">Best time</div><div class="v">'+esc(c.best||"")+'</div></div>'+
   '<div class="fact"><div class="k">Insider tip</div><div class="v">'+esc(c.tip||"")+'</div></div></div>'+
   (c.lat?'<div id="map"></div>':'')+
   '<a href="'+esc(c.src)+'" target="_blank" rel="noopener">Read more on Wikipedia</a>'+
   '<div class="lic">'+esc(c.lic||"Wikipedia contributors, CC BY-SA 4.0")+'</div></div>';
  document.getElementById("modal").classList.add("open");
  if(c.lat)setTimeout(()=>{map=L.map("map",{scrollWheelZoom:false}).setView([c.lat,c.lng],13);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
    L.marker([c.lat,c.lng]).addTo(map);},150);
}
function closeDD(){document.getElementById("modal").classList.remove("open");if(map){map.remove();map=null;}}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeDD();});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");VIEW=b.dataset.v;render();window.scrollTo({top:0});});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
load();startLangs();
</script>
</body>
</html>
