<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007A4D">
<title>Welcome SA</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --green:#007A4D; --gold:#FFB612; --red:#E03C31; --blue:#001489;
  --ink:#1d1d1d; --cream:#FFF8EE; --card:#ffffff; --line:#eadfce; --muted:#6b6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink)}
a{color:var(--blue)}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--green),#005c3a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash .word{font-size:2.6rem;font-weight:800;min-height:3.4rem}
#splash .lang{font-size:1rem;opacity:.85;margin-top:6px}
#splash .flag{display:flex;gap:5px;margin-bottom:26px}
#splash .flag span{width:26px;height:8px;border-radius:4px}
#splash .tap{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 30px);font-size:.8rem;opacity:.7}
#dots{display:flex;gap:6px;margin-top:22px}
#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
#dots i.on{background:var(--gold)}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
header h1{margin:0;font-size:1.2rem;letter-spacing:.5px}
header h1 b{color:var(--gold)}
header .sub{font-size:.7rem;opacity:.85;margin-top:2px}
/* nav */
nav{display:flex;gap:6px;padding:10px 14px 4px;position:sticky;top:calc(env(safe-area-inset-top) + 58px);background:var(--cream);z-index:15}
nav button{flex:1;padding:9px 2px;font-size:.85rem;font-weight:700;border:none;border-radius:10px;background:#e7ddcb;color:var(--muted);cursor:pointer}
nav button.on{background:var(--green);color:#fff}
/* explore controls */
#ctrl{padding:8px 14px}
#q{width:100%;padding:11px 14px;font-size:1rem;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none}
#chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;-webkit-overflow-scrolling:touch}
#chips button{flex:none;padding:7px 13px;font-size:.78rem;font-weight:700;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
#chips button.on{background:var(--gold);border-color:var(--gold);color:#3a2c00}
/* cards */
main{padding:8px 14px 24px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:9px;cursor:pointer}
.card img{width:86px;height:86px;object-fit:cover;border-radius:10px;flex:none;background:#e7ddcb}
.card .nophoto{width:86px;height:86px;border-radius:10px;flex:none;background:linear-gradient(140deg,var(--gold),var(--red));display:flex;align-items:center;justify-content:center;font-size:1.7rem}
.card .body{flex:1;min-width:0}
.card .name{font-weight:800;font-size:.98rem}
.card .meta{font-size:.74rem;color:var(--muted);margin-top:3px}
.card .sum{font-size:.8rem;color:#444;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-block;font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:12px;background:#e8f3ee;color:var(--green);text-transform:uppercase;letter-spacing:.4px}
.empty{text-align:center;color:var(--muted);padding:34px 20px;font-size:.9rem}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#modal.open{display:flex}
#sheet{background:#fff;width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
#sheet .x{float:right;font-size:1.3rem;border:none;background:none;cursor:pointer;color:var(--muted)}
#sheet h2{margin:4px 0 8px;font-size:1.25rem}
#sheet img.hero{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
#sheet .meta{font-size:.78rem;color:var(--muted);margin:8px 0}
#sheet .sum{font-size:.92rem;line-height:1.5}
#map{height:200px;border-radius:12px;margin:12px 0;background:#e7ddcb}
.lic{font-size:.68rem;color:var(--muted);margin-top:10px}
/* gigs */
.gig{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:11px 13px;margin-bottom:9px}
.gig .d{font-size:.72rem;font-weight:800;color:var(--red);text-transform:uppercase}
.gig .n{font-weight:800;margin:2px 0}
.gig .v{font-size:.78rem;color:var(--muted)}
/* about */
.about{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.86rem;line-height:1.55}
.about h3{margin:14px 0 6px;font-size:.95rem}
.about code{background:#f2ecdf;padding:1px 5px;border-radius:5px;font-size:.78rem}
footer{padding:14px;text-align:center;font-size:.7rem;color:var(--muted)}
#updated{font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="splash">
  <div class="flag">
    <span style="background:#E03C31"></span><span style="background:#FFB612"></span>
    <span style="background:#007A4D"></span><span style="background:#001489"></span>
    <span style="background:#fff"></span><span style="background:#141414"></span>
  </div>
  <div class="word" id="splashWord">Welcome</div>
  <div class="lang" id="splashLang">English</div>
  <div id="dots"></div>
  <div class="tap">tap anywhere to explore</div>
</div>

<header>
  <h1>WELCOME <b>SA</b></h1>
  <div class="sub">Discover South Africa &middot; <span id="updated">loading&hellip;</span></div>
</header>

<nav>
  <button data-v="explore" class="on">Explore</button>
  <button data-v="gigs">Gigs</button>
  <button data-v="about">About</button>
</nav>

<main id="view">Loading&hellip;</main>

<div id="modal"><div id="sheet"></div></div>

<footer>
  Data: Wikipedia (CC BY-SA) + event sources &middot; <a href="data/ATTRIBUTION.md">Attribution</a><br>
  Built by Ravin Rupnarain &amp; Kimi &middot; updates itself daily
</footer>

<script>
const LANGS = [
  ["Welcome","English"],["Sawubona","isiZulu"],["Molo","isiXhosa"],["Welkom","Afrikaans"],
  ["Dumela","Sepedi"],["Dumela","Setswana"],["Dumela","Sesotho"],["Avuxeni","Xitsonga"],
  ["Sawubona","siSwati"],["Ndaa / Aa","Tshivenda"],["Lotjani","isiNdebele"],["\u{1F91F}","SASL"]
];
const esc = s => (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ATT=null, GIGS=null, VIEW="explore", CAT="all", map=null;

/* splash */
(function(){
  const seen = localStorage.getItem("wsa_splash");
  if (seen && Date.now()-+seen < 864e5) { document.getElementById("splash").classList.add("hide"); return; }
  const dots = document.getElementById("dots");
  LANGS.forEach((_,i)=>{ const d=document.createElement("i"); if(!i) d.className="on"; dots.appendChild(d); });
  let i=0;
  const w=document.getElementById("splashWord"), l=document.getElementById("splashLang");
  const iv=setInterval(()=>{
    i=(i+1)%LANGS.length;
    w.textContent=LANGS[i][0]; l.textContent=LANGS[i][1];
    [...dots.children].forEach((d,j)=>d.classList.toggle("on",j===i));
    if(i===LANGS.length-1){ clearInterval(iv); setTimeout(()=>close(),1600); }
  },900);
  function close(){ document.getElementById("splash").classList.add("hide");
    localStorage.setItem("wsa_splash", Date.now()); }
  document.getElementById("splash").addEventListener("click", ()=>{ clearInterval(iv); close(); });
})();

async function load(){
  try {
    const [a,g] = await Promise.all([
      fetch("data/attractions.json",{cache:"no-store"}).then(r=>r.ok?r.json():null),
      fetch("data/gigs.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    ATT=a; GIGS=g;
    if(a && a.generated_at){
      const d=new Date(a.generated_at);
      document.getElementById("updated").textContent =
        new Intl.DateTimeFormat("en-ZA",{day:"2-digit",month:"short"}).format(d);
    } else document.getElementById("updated").textContent="data pending";
  } catch(e){ document.getElementById("updated").textContent="offline"; }
  render();
}

const CATS=[["all","All"],["natural","Nature"],["cultural","Culture"],["historical","History"],["beach","Beaches"],["wildlife","Wildlife"],["activity","Activities"]];

function render(){
  const v=document.getElementById("view");
  if(VIEW==="explore"){
    const list=(ATT&&ATT.attractions)||[];
    const q=(document.getElementById("q")?.value||"").toLowerCase();
    let shown=list.filter(a=>CAT==="all"||a.category===CAT);
    if(q) shown=shown.filter(a=>(a.name+" "+(a.summary||"")).toLowerCase().includes(q));
    v.innerHTML =
      '<div id="ctrl"><input id="q" type="search" placeholder="Search places in South Africa\u2026" value="'+esc(q)+'"></div>'+
      '<div id="chips">'+CATS.map(([k,label])=>'<button data-c="'+k+'" class="'+(CAT===k?"on":"")+'">'+label+'</button>').join("")+'</div>'+
      (shown.length? shown.map(cardHtml).join("") :
        '<div class="empty">'+(list.length?"Nothing matches - try another search.":"The explorer is warming up - data arrives after the first robot run.")+'</div>');
    document.getElementById("q").addEventListener("input", render);
    document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{CAT=b.dataset.c; render();});
    v.querySelectorAll(".card").forEach((c,i)=>c.onclick=()=>openDetail(shown[i]));
  }
  else if(VIEW==="gigs"){
    const evs=(GIGS&&GIGS.events)||[];
    v.innerHTML = evs.length
      ? evs.map(e=>{
          const d=e.start?new Date(e.start):null;
          const ds=d?new Intl.DateTimeFormat("en-ZA",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}).format(d):"";
          return '<div class="gig"><div class="d">'+esc(ds)+'</div><div class="n">'+esc(e.name)+'</div>'+
                 '<div class="v">'+esc(e.venue||"")+(e.url?' &middot; <a href="'+esc(e.url)+'" target="_blank" rel="noopener">tickets/info</a>':'')+
                 ' &middot; via '+esc(e.source)+'</div></div>';
        }).join("")
      : '<div class="empty">The gig guide is warming up - event sources are connected and the robot is tuning in more. Check back soon.</div>';
  }
  else {
    v.innerHTML = '<div class="about">'+
      '<h3>Welcome SA</h3>A community-built showcase of South Africa: places to see, gigs to catch.'+
      '<h3>Data &amp; licences</h3>Places: <code>Wikipedia</code> contributors, CC BY-SA 4.0 - every entry links to its article. Events: venue and ticketing listings (Ticketpro, Durban ICC, WhatsOnDurban, Webtickets). Maps: (c) <code>OpenStreetMap</code> contributors, ODbL.'+
      '<h3>Colophon</h3>Built by Ravin Rupnarain &amp; Kimi. Robot updates data daily. Free forever, no logins.'+
      '</div>';
  }
}

function cardHtml(a){
  return '<div class="card">'+
    (a.image?'<img src="'+esc(a.image)+'" alt="" loading="lazy">':'<div class="nophoto">\u{1F3D4}\uFE0F</div>')+
    '<div class="body"><div class="name">'+esc(a.name)+' <span class="badge">'+esc(a.category)+'</span></div>'+
    '<div class="meta">'+esc(a.province)+(a.lat?"":" &middot; map coming")+'</div>'+
    '<div class="sum">'+esc(a.summary||"")+'</div></div></div>';
}

function openDetail(a){
  const sh=document.getElementById("sheet");
  sh.innerHTML='<button class="x" onclick="closeDetail()">\u2715</button>'+
    (a.image?'<img class="hero" src="'+esc(a.image)+'">':'')+
    '<h2>'+esc(a.name)+'</h2>'+
    '<div class="meta"><span class="badge">'+esc(a.category)+'</span> &middot; '+esc(a.province)+'</div>'+
    '<div class="sum">'+esc(a.summary||"")+'</div>'+
    '<div id="map"></div>'+
    (a.lat?'' :'<div class="empty">Map location being added.</div>')+
    '<a href="'+esc(a.source_url)+'" target="_blank" rel="noopener">Read more on Wikipedia</a>'+
    '<div class="lic">'+esc(a.license||"Wikipedia contributors, CC BY-SA 4.0")+'</div>';
  document.getElementById("modal").classList.add("open");
  if(a.lat){
    setTimeout(()=>{
      map=L.map("map",{scrollWheelZoom:false}).setView([a.lat,a.lng],13);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
        attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
      L.marker([a.lat,a.lng]).addTo(map);
    },150);
  }
}
function closeDetail(){ document.getElementById("modal").classList.remove("open"); if(map){map.remove();map=null;} }
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeDetail(); });

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); VIEW=b.dataset.v; render(); window.scrollTo({top:0});
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
load();
</script>
</body>
</html>
